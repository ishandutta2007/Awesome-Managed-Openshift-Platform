<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1127" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE0000" />
      <stop offset="50%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF7961" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #EE0000); }
    }
    @keyframes pulseNodeBlue {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 12px #3B82F6); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }

    .bg-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .connect-line { stroke: url(#primaryGlow); stroke-width: 1.5; stroke-dasharray: 6 6; animation: dashMove 12s linear infinite; }
    .connect-line-blue { stroke: url(#blueGlow); stroke-width: 1.5; stroke-dasharray: 5 5; animation: dashMove 16s linear infinite reverse; }

    .animated-node-red { transform-origin: center; animation: pulseNode 4s ease-in-out infinite; }
    .animated-node-blue { transform-origin: center; animation: pulseNodeBlue 5s ease-in-out infinite 1s; }
    .floating-container { animation: floatParticle 6s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #9CA3AF;
    }

    .badge-bg { fill: rgba(238, 0, 0, 0.15); stroke: rgba(238, 0, 0, 0.4); stroke-width: 1; }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #FF6B6B;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGradient)" rx="12" />

  <!-- Background Grid -->
  <g class="bg-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Background Dynamic Nodes & Connections (Placed behind text area or in corners) -->
  <g class="floating-container">
    <!-- Connecting lines in right background area -->
    <path d="M 850 70 L 1020 140 L 1120 90 L 1050 250 L 900 280 Z" class="connect-line" />
    <path d="M 900 100 L 1100 220 L 980 290 Z" class="connect-line-blue" />

    <!-- Animated Nodes in Right Hemisphere -->
    <circle cx="1020" cy="140" r="8" fill="#EE0000" class="animated-node-red" filter="url(#glow)" />
    <circle cx="1120" cy="90" r="6" fill="#3B82F6" class="animated-node-blue" filter="url(#glow)" />
    <circle cx="1050" cy="250" r="9" fill="#8B5CF6" class="animated-node-blue" />
    <circle cx="900" cy="280" r="7" fill="#EE0000" class="animated-node-red" />
    <circle cx="850" cy="70" r="5" fill="#60A5FA" class="animated-node-blue" />

    <!-- Small decorative orbital rings -->
    <circle cx="1020" cy="140" r="22" fill="none" stroke="rgba(238,0,0,0.3)" stroke-width="1" />
    <circle cx="1050" cy="250" r="30" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="50" y="75" width="6" height="190" rx="3" fill="url(#primaryGlow)" filter="url(#glow)" />

  <!-- Foreground Content Area (Ensured crystal clear readability) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="72" width="220" height="28" rx="14" class="badge-bg" />
    <text x="14" y="91" class="badge-text">⚡ ENTERPRISE KUBERNETES</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title-text">Awesome Managed OpenShift</text>
    <text x="0" y="200" class="title-text" fill="url(#primaryGlow)">&amp; Container Platform Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="242" class="subtitle-text">Curated SaaS Platforms, Enterprise Distributions &amp; Open-Source Projects</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 268)">
      <!-- OpenShift -->
      <rect x="0" y="0" width="100" height="24" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="50" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">OpenShift</text>

      <!-- Kubernetes -->
      <rect x="110" y="0" width="100" height="24" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="160" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">Kubernetes</text>

      <!-- OKD -->
      <rect x="220" y="0" width="70" height="24" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="255" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">OKD</text>

      <!-- GitOps -->
      <rect x="300" y="0" width="80" height="24" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="340" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">GitOps</text>

      <!-- Multi-Cloud -->
      <rect x="390" y="0" width="100" height="24" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="440" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">Multi-Cloud</text>
    </g>
  </g>
</svg>
